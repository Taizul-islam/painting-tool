name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Install LibreOffice
        shell: powershell
        run: |
          choco install libreoffice-fresh -y --no-progress

      - name: Install Poppler
        shell: powershell
        run: |
          choco install poppler -y --no-progress

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Create tools directory
        shell: powershell
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Path "$buildDir\tools\libreoffice" -Force
          New-Item -ItemType Directory -Path "$buildDir\tools\poppler" -Force
          Write-Host "Created tools directories"

      - name: Copy LibreOffice
        shell: powershell
        run: |
          $source = "C:\Program Files\LibreOffice"
          $destination = "build\windows\x64\runner\Release\tools\libreoffice"
          
          if (Test-Path $source) {
            Write-Host "Copying LibreOffice from $source to $destination"
            robocopy $source $destination /E /NFL /NDL /NJH /NJS /NC /NS /NP
            Write-Host "LibreOffice copied successfully"
          } else {
            Write-Host "LibreOffice not found at $source"
            # Check alternative location
            $altSource = "C:\Program Files (x86)\LibreOffice"
            if (Test-Path $altSource) {
              Write-Host "Found at alternative location: $altSource"
              robocopy $altSource $destination /E /NFL /NDL /NJH /NJS /NC /NS /NP
            }
          }

      - name: Copy Poppler
        shell: powershell
        run: |
          $source = "C:\ProgramData\chocolatey\lib\poppler\tools"
          $destination = "build\windows\x64\runner\Release\tools\poppler"
          
          if (Test-Path $source) {
            Write-Host "Copying Poppler from $source to $destination"
            robocopy $source $destination /E /NFL /NDL /NJH /NJS /NC /NS /NP
            Write-Host "Poppler copied successfully"
          } else {
            Write-Host "Poppler not found at $source"
            # Try to find pdftoppm
            $pdftoppm = Get-ChildItem "C:\ProgramData\chocolatey" -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($pdftoppm) {
              $pdftoppmDir = $pdftoppm.DirectoryName
              Write-Host "Found pdftoppm at: $pdftoppmDir"
              New-Item -ItemType Directory -Path "$destination\bin" -Force
              Copy-Item "$pdftoppmDir\*" "$destination\bin\" -Recurse -Force
            }
          }

      - name: Verify tools
        shell: powershell
        run: |
          Write-Host "Verifying bundled tools..."
          $toolsDir = "build\windows\x64\runner\Release\tools"
          
          if (Test-Path $toolsDir) {
            Get-ChildItem $toolsDir -Recurse -Depth 2 | Select-Object FullName | ForEach-Object { Write-Host $_.FullName }
          }
          
          # Check for soffice.exe
          $soffice = Get-ChildItem $toolsDir -Recurse -Filter "soffice.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($soffice) {
            Write-Host "✅ Found soffice.exe at: $($soffice.FullName)"
          } else {
            Write-Host "⚠️ soffice.exe not found in tools"
          }
          
          # Check for pdftoppm.exe
          $pdftoppm = Get-ChildItem $toolsDir -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pdftoppm) {
            Write-Host "✅ Found pdftoppm.exe at: $($pdftoppm.FullName)"
          } else {
            Write-Host "⚠️ pdftoppm.exe not found in tools"
          }

      - name: Create ZIP (Portable Version)
        shell: powershell
        run: |
          $zipName = "PresentationPro_Portable_v${{ github.ref_name }}.zip"
          if ("${{ github.ref_type }}" -ne "tag") { 
            $zipName = "PresentationPro_Portable_Manual.zip" 
          }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pro-portable
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body: |
            **Presentation Pro - Portable Version**
            
            Just extract the ZIP and run `mobile.exe` - no installation needed!
            
            **Features:**
            - ✅ PPTX support with perfect rendering
            - ✅ PDF viewing
            - ✅ Drawing and annotation tools
            - ✅ All tools bundled (LibreOffice + Poppler)
            - ✅ No additional installation required
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
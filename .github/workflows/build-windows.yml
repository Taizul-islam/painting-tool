name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Install LibreOffice
        shell: powershell
        run: |
          choco install libreoffice-fresh -y --no-progress

      - name: Download Poppler
        shell: powershell
        run: |
          Write-Host "Downloading Poppler..."
          $popplerUrl = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          
          try {
            Invoke-WebRequest -Uri $popplerUrl -OutFile "poppler.zip" -ErrorAction Stop
            Write-Host "✅ Poppler downloaded successfully"
          } catch {
            Write-Host "Failed with first URL, trying alternative..."
            $altUrls = @(
              "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.07.0-0/Release-24.07.0-0.zip",
              "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.02.0-0/Release-24.02.0-0.zip",
              "https://github.com/oschwartz10612/poppler-windows/releases/download/v23.11.0-0/Release-23.11.0-0.zip"
            )
          
            $downloaded = $false
            foreach ($url in $altUrls) {
              try {
                Write-Host "Trying: $url"
                Invoke-WebRequest -Uri $url -OutFile "poppler.zip" -ErrorAction Stop
                Write-Host "✅ Poppler downloaded successfully"
                $downloaded = $true
                break
              } catch {
                Write-Host "Failed: $url"
              }
            }
          
            if (-not $downloaded) {
              Write-Host "⚠️ All download attempts failed"
              Write-Host "Trying to install via Chocolatey..."
              choco install poppler -y --no-progress
            }
          }

      - name: Extract Poppler
        shell: powershell
        run: |
          Write-Host "Extracting Poppler..."
          
          if (Test-Path "poppler.zip") {
            # Extract to temporary directory
            Expand-Archive -Path "poppler.zip" -DestinationPath "poppler_extracted" -Force
          
            # Find the poppler directory
            $popplerDir = Get-ChildItem "poppler_extracted" -Directory | Select-Object -First 1
          
            if ($popplerDir) {
              Write-Host "Found poppler directory: $($popplerDir.FullName)"
          
              # Look for Library/bin or bin directory
              $binDir = Get-ChildItem $popplerDir.FullName -Recurse -Directory -Filter "bin" | Select-Object -First 1
          
              if ($binDir) {
                Write-Host "Found bin directory: $($binDir.FullName)"
          
                # Copy to build directory
                $destDir = "build\windows\x64\runner\Release\tools\poppler"
                New-Item -ItemType Directory -Path $destDir -Force
          
                Copy-Item -Path "$($binDir.FullName)\*" -Destination $destDir -Recurse -Force
                Write-Host "✅ Poppler copied to $destDir"
              } else {
                Write-Host "⚠️ bin directory not found, copying all..."
                $destDir = "build\windows\x64\runner\Release\tools\poppler"
                New-Item -ItemType Directory -Path $destDir -Force
                Copy-Item -Path "$($popplerDir.FullName)\*" -Destination $destDir -Recurse -Force
                Write-Host "Copied all poppler files"
              }
            } else {
              Write-Host "⚠️ No directory found in poppler_extracted"
            }
          } else {
            Write-Host "⚠️ poppler.zip not found, trying chocolatey..."
            $pdftoppm = Get-ChildItem "C:\ProgramData\chocolatey" -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          
            if ($pdftoppm) {
              Write-Host "Found pdftoppm at: $($pdftoppm.FullName)"
              $destDir = "build\windows\x64\runner\Release\tools\poppler"
              New-Item -ItemType Directory -Path $destDir -Force
              $sourceDir = $pdftoppm.DirectoryName
              Copy-Item -Path "$sourceDir\*" -Destination $destDir -Recurse -Force
              Write-Host "Copied from $sourceDir"
            }
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Create tools directory
        shell: powershell
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Path "$buildDir\tools\libreoffice" -Force
          New-Item -ItemType Directory -Path "$buildDir\tools\poppler" -Force
          Write-Host "Created tools directories"

      - name: Copy LibreOffice
        shell: cmd
        run: |
          if exist "C:\Program Files\LibreOffice" (
            echo Copying LibreOffice...
            robocopy "C:\Program Files\LibreOffice" "build\windows\x64\runner\Release\tools\libreoffice" /E /NFL /NDL /NJH /NJS /NC /NS /NP
            if %ERRORLEVEL% LEQ 3 (
              echo LibreOffice copied successfully
              exit /b 0
            ) else (
              echo LibreOffice copy failed with error %ERRORLEVEL%
              exit /b 1
            )
          ) else (
            echo LibreOffice not found at standard location
            echo Trying alternative...
            if exist "C:\Program Files (x86)\LibreOffice" (
              robocopy "C:\Program Files (x86)\LibreOffice" "build\windows\x64\runner\Release\tools\libreoffice" /E /NFL /NDL /NJH /NJS /NC /NS /NP
              if %ERRORLEVEL% LEQ 3 (
                echo LibreOffice copied successfully
                exit /b 0
              )
            )
            exit /b 1
          )

      - name: Verify tools
        shell: powershell
        run: |
          Write-Host "Verifying bundled tools..."
          $toolsDir = "build\windows\x64\runner\Release\tools"
          
          # Check for soffice.exe
          $soffice = Get-ChildItem $toolsDir -Recurse -Filter "soffice.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($soffice) {
            Write-Host "✅ Found soffice.exe at: $($soffice.FullName)"
          } else {
            Write-Host "⚠️ soffice.exe not found"
            Write-Host "Searching entire build directory..."
            $soffice = Get-ChildItem "build\windows\x64\runner\Release" -Recurse -Filter "soffice.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($soffice) {
              Write-Host "Found soffice.exe at: $($soffice.FullName)"
            }
          }
          
          # Check for pdftoppm.exe
          $pdftoppm = Get-ChildItem $toolsDir -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pdftoppm) {
            Write-Host "✅ Found pdftoppm.exe at: $($pdftoppm.FullName)"
          } else {
            Write-Host "⚠️ pdftoppm.exe not found in tools"
            Write-Host "Searching entire build directory..."
            $pdftoppm = Get-ChildItem "build\windows\x64\runner\Release" -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($pdftoppm) {
              Write-Host "Found pdftoppm.exe at: $($pdftoppm.FullName)"
            }
          }

      - name: Create ZIP (Portable Version)
        shell: powershell
        run: |
          $zipName = "PresentationPro_Portable_v${{ github.ref_name }}.zip"
          if ("${{ github.ref_type }}" -ne "tag") { 
            $zipName = "PresentationPro_Portable_Manual.zip" 
          }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pro-portable
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body: |
            **Presentation Pro - Portable Version**
            
            Just extract the ZIP and run `mobile.exe` - no installation needed!
            
            **Features:**
            - ✅ PPTX support with perfect rendering
            - ✅ PDF viewing
            - ✅ Drawing and annotation tools
            - ✅ All tools bundled (LibreOffice + Poppler)
            - ✅ No additional installation required
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
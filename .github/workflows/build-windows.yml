name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Install LibreOffice
        shell: powershell
        run: |
          choco install libreoffice-fresh -y --no-progress

      - name: Install Poppler
        shell: powershell
        run: |
          choco install poppler -y --no-progress

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Create tools directory
        shell: powershell
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Path "$buildDir\tools\libreoffice" -Force
          New-Item -ItemType Directory -Path "$buildDir\tools\poppler" -Force
          New-Item -ItemType Directory -Path "$buildDir\tools\poppler\bin" -Force
          Write-Host "Created tools directories"

      - name: Copy LibreOffice
        shell: cmd
        run: |
          if exist "C:\Program Files\LibreOffice" (
            echo Copying LibreOffice...
            robocopy "C:\Program Files\LibreOffice" "build\windows\x64\runner\Release\tools\libreoffice" /E /NFL /NDL /NJH /NJS /NC /NS /NP
            if %ERRORLEVEL% LEQ 3 (
              echo LibreOffice copied successfully
              exit /b 0
            ) else (
              echo LibreOffice copy failed with error %ERRORLEVEL%
              exit /b 1
            )
          ) else (
            echo LibreOffice not found
            exit /b 1
          )

      - name: Copy Poppler
        shell: powershell
        run: |
          Write-Host "Finding pdftoppm.exe..."
          
          # Search for pdftoppm.exe in chocolatey installation
          $pdftoppm = Get-ChildItem "C:\ProgramData\chocolatey" -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($pdftoppm) {
            Write-Host "Found pdftoppm.exe at: $($pdftoppm.FullName)"
            $sourceDir = $pdftoppm.DirectoryName
            $destDir = "build\windows\x64\runner\Release\tools\poppler\bin"
          
            Write-Host "Copying from: $sourceDir"
            Write-Host "Copying to: $destDir"
          
            # Copy all files from the pdftoppm directory
            Copy-Item -Path "$sourceDir\*" -Destination $destDir -Recurse -Force
          
            Write-Host "Poppler files copied"
          
            # Also copy DLLs if they exist in parent directory
            $parentDir = Split-Path $sourceDir -Parent
            $dllFiles = Get-ChildItem $parentDir -Filter "*.dll" -ErrorAction SilentlyContinue
            if ($dllFiles) {
              Write-Host "Copying DLL files..."
              Copy-Item -Path "$parentDir\*.dll" -Destination $destDir -Force
            }
          
            # Check if pdftoppm.exe exists in destination
            if (Test-Path "$destDir\pdftoppm.exe") {
              Write-Host "✅ pdftoppm.exe copied successfully"
            } else {
              Write-Host "⚠️ pdftoppm.exe not found in destination"
              # Try to find it recursively
              $found = Get-ChildItem "build\windows\x64\runner\Release\tools\poppler" -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                Write-Host "✅ pdftoppm.exe found at: $($found.FullName)"
              }
            }
          } else {
            Write-Host "⚠️ pdftoppm.exe not found in chocolatey"
            Write-Host "Trying to find in other locations..."
          
            # Check common locations
            $locations = @(
              "C:\Program Files\poppler",
              "C:\Program Files (x86)\poppler",
              "C:\poppler"
            )
          
            foreach ($loc in $locations) {
              if (Test-Path $loc) {
                Write-Host "Found poppler at: $loc"
                Copy-Item -Path "$loc\*" -Destination "build\windows\x64\runner\Release\tools\poppler" -Recurse -Force
                Write-Host "Poppler copied from $loc"
                break
              }
            }
          }

      - name: Verify tools
        shell: powershell
        run: |
          Write-Host "Verifying bundled tools..."
          $toolsDir = "build\windows\x64\runner\Release\tools"
          
          # Check for soffice.exe
          $soffice = Get-ChildItem $toolsDir -Recurse -Filter "soffice.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($soffice) {
            Write-Host "✅ Found soffice.exe at: $($soffice.FullName)"
          } else {
            Write-Host "⚠️ soffice.exe not found"
          }
          
          # Check for pdftoppm.exe
          $pdftoppm = Get-ChildItem $toolsDir -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pdftoppm) {
            Write-Host "✅ Found pdftoppm.exe at: $($pdftoppm.FullName)"
          } else {
            Write-Host "⚠️ pdftoppm.exe not found"
            Write-Host "Contents of poppler directory:"
            Get-ChildItem "$toolsDir\poppler" -Recurse | Select-Object FullName | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Create ZIP (Portable Version)
        shell: powershell
        run: |
          $zipName = "PresentationPro_Portable_v${{ github.ref_name }}.zip"
          if ("${{ github.ref_type }}" -ne "tag") { 
            $zipName = "PresentationPro_Portable_Manual.zip" 
          }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pro-portable
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body: |
            **Presentation Pro - Portable Version**
            
            Just extract the ZIP and run `mobile.exe` - no installation needed!
            
            **Features:**
            - ✅ PPTX support with perfect rendering
            - ✅ PDF viewing
            - ✅ Drawing and annotation tools
            - ✅ All tools bundled (LibreOffice + Poppler)
            - ✅ No additional installation required
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Needed for creating releases
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.2'
        channel: 'stable'
        cache: true
    
    - name: Enable Windows support
      run: flutter config --enable-windows-desktop
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build Windows EXE
      run: flutter build windows --release
    
    - name: Create ZIP archive
      shell: powershell
      run: |
        $zipName = "presentation_pro_v${{ github.ref_name }}_windows.zip"
        # If triggered manually without a tag, use a default name
        if ("${{ github.ref_type }}" -ne "tag") { $zipName = "presentation_pro_manual_windows.zip" }
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: presentation-pro-windows
        path: ${{ env.ZIP_NAME }}
        retention-days: 30
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_NAME }}
        body: |
          Professional Presentation Painting Tool - Windows Release.
          
          **Release Notes:**
          - Initial Windows release with PPTX and PDF support.
          - High-performance lazy rendering for large files.
          - Real-time drawing and annotation tools.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
